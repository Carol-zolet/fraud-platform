name: CI/CD - Fraud Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: fraud-platform
  GKE_CLUSTER: fraud-platform-cluster
  GKE_ZONE: us-central1
  REGISTRY: gcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Auth Service
        run: |
          cd auth-service
          npm install
          npm run test

      - name: Test API Gateway
        run: |
          cd api-gateway
          npm install
          npm run test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Auth Service
        run: |
          docker build -t $REGISTRY/$PROJECT_ID/auth-service:$GITHUB_SHA ./auth-service
          docker push $REGISTRY/$PROJECT_ID/auth-service:$GITHUB_SHA

      - name: Build API Gateway
        run: |
          docker build -t $REGISTRY/$PROJECT_ID/api-gateway:$GITHUB_SHA ./api-gateway
          docker push $REGISTRY/$PROJECT_ID/api-gateway:$GITHUB_SHA

      - name: Build ML Serving
        run: |
          docker build -t $REGISTRY/$PROJECT_ID/ml-serving:$GITHUB_SHA ./ml-serving
          docker push $REGISTRY/$PROJECT_ID/ml-serving:$GITHUB_SHA

      - name: Deploy to GKE
        run: |
          gcloud container clusters get-credentials $GKE_CLUSTER --zone $GKE_ZONE
          kubectl apply -f k8s/
          kubectl set image deployment/auth-service auth-service=$REGISTRY/$PROJECT_ID/auth-service:$GITHUB_SHA -n fraud-platform
          kubectl set image deployment/api-gateway api-gateway=$REGISTRY/$PROJECT_ID/api-gateway:$GITHUB_SHA -n fraud-platform
          kubectl set image deployment/ml-serving ml-serving=$REGISTRY/$PROJECT_ID/ml-serving:$GITHUB_SHA -n fraud-platform
